<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>쉽배송 QA 대시보드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* === [PC 기본 스타일 유지] === */
        :root { 
            --sidebar-width: 260px; 
            --primary-color: #00c2de; 
            --sidebar-bg: #111827;
            --bg-color: #F3F4F6; 
            --card-bg: #FFFFFF; 
            --text-main: #111827; 
            --text-sub: #6B7280; 
            --success: #10B981; 
            --danger: #EF4444; 
            --border: #E5E7EB; 
            --hover-bg: #F9FAFB; 
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        aside { 
            width: var(--sidebar-width); 
            background-color: var(--sidebar-bg); 
            color: white; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            flex-shrink: 0; 
            transition: transform 0.3s ease; 
            z-index: 50; 
        }
        
        .brand { 
            font-size: 1.4rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            margin-bottom: 40px; 
            color: #fff; 
            padding-left: 10px; 
            letter-spacing: -0.5px; 
        }

        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; color: #9CA3AF; font-weight: 500; text-decoration: none; margin-bottom: 5px; transition: all 0.2s; cursor: pointer; font-size: 0.95rem; }
        .menu-item:hover, .menu-item.active { background-color: #374151; color: var(--primary-color); font-weight: 700; }
        .menu-item.fail-menu:hover, .menu-item.fail-menu.active { background-color: rgba(239, 68, 68, 0.2); color: #FCA5A5; }
        .menu-badge { background: #EF4444; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; margin-left: auto; }
        .menu-category { font-size: 0.75rem; color: #6B7280; margin-top: 20px; margin-bottom: 10px; padding-left: 10px; font-weight: 600; }
        .spacer-bottom { margin-top: auto; }

        /* Main Content */
        main { flex: 1; overflow-y: auto; padding: 30px; position: relative; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; height: 42px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        #btn-menu-toggle { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; padding: 0; }
        #btn-menu-toggle .material-icons-round { font-size: 28px; }
        h1 { margin: 0; font-size: 1.5rem; font-weight: 700; }
        .last-updated { color: var(--text-sub); font-size: 0.9rem; margin-top: 5px; }
        .last-updated.hidden { display: none; }
        .btn-primary { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
        .btn-primary:hover { opacity: 0.9; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .stat-label { color: var(--text-sub); font-size: 0.85rem; font-weight: 500; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 10px; }
        .stat-value.pass { color: var(--success); }
        .stat-value.fail { color: var(--danger); }

        /* Accordion */
        .accordion-container { display: flex; flex-direction: column; gap: 15px; }
        .accordion-item { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: all 0.3s ease; }
        .accordion-header { 
            display: flex; align-items: center; padding: 15px 20px; background: #F9FAFB; cursor: pointer; 
            border-bottom: 1px solid transparent; 
            -webkit-user-select: none; user-select: none; 
        }
        .accordion-item.active .accordion-header { border-bottom: 1px solid var(--border); }
        .checkbox-wrapper { display: flex; align-items: center; margin-right: 15px; cursor: default; }
        .date-title { font-weight: 600; color: #374151; font-size: 1rem; flex: 1; display: flex; align-items: center; gap: 10px; }
        .header-status { font-size: 0.75rem; margin-left: 10px; }
        .toggle-icon { color: var(--text-sub); transition: transform 0.3s; }
        .accordion-item.active .toggle-icon { transform: rotate(180deg); }
        .accordion-content { display: none; padding: 0; }
        .accordion-item.active .accordion-content { display: block; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 2-Row List Style */
        .session-list-container { display: flex; flex-direction: column; }
        .session-item {
            display: flex; flex-direction: column;
            padding: 20px 24px;
            border-bottom: 1px solid #E5E7EB;
            gap: 12px;
        }
        .session-item:last-child { border-bottom: none; }
        .session-item:hover { background-color: #F9FAFB; }

        .item-top-row { display: flex; align-items: center; justify-content: space-between; }
        .item-info { display: flex; align-items: center; gap: 15px; }
        .item-id { font-family: monospace; font-weight: 700; color: var(--primary-color); font-size: 1rem; }
        .item-title { font-weight: 700; color: #111827; font-size: 1rem; }
        
        .item-desc { 
            color: #4B5563; font-size: 0.95rem; line-height: 1.5; 
            padding-left: 0; 
        }

        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-badge.pass { background: #D1FAE5; color: #065F46; }
        .status-badge.fail { background: #FEE2E2; color: #991B1B; }
        .status-badge.na { background: #E5E7EB; color: #6B7280; } /* 회색 */

        /* Overview Table */
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th { background: #F9FAFB; padding: 14px 20px; font-weight: 700; color: #4B5563; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        td { padding: 16px 20px; border-bottom: 1px solid #F3F4F6; color: #374151; font-size: 0.95rem; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .empty-row { text-align: center; color: #999; font-size: 0.8rem; padding: 40px; }

        /* Layouts */
        .session-body { display: flex; padding: 0; gap: 0; }
        .video-box { flex: 0 0 45%; padding: 20px; border-right: 1px solid #E5E7EB; background:#f9fafb; display:flex; align-items:center; justify-content:center;}
        video { width: 100%; border-radius: 8px; border: 1px solid #E5E7EB; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .log-table-wrapper { flex: 1; max-height: 600px; overflow-y: auto; }

        /* Failures & Modal */
        .success-state { text-align: center; padding: 80px 20px; color: var(--text-sub); }
        .success-icon { font-size: 4rem; color: var(--success); margin-bottom: 20px; }
        .success-title { font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
        .fail-card { background: white; border: 1px solid #FECACA; border-radius: 12px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .fail-header { background: #FEF2F2; padding: 15px 20px; border-bottom: 1px solid #FECACA; display: flex; align-items: center; gap: 15px; }
        .fail-tag { background: #EF4444; color: white; padding: 4px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
        .fail-title { font-weight: 600; color: #991B1B; font-size: 1.1rem; }
        .fail-body { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        .error-log-box { background: #1F2937; color: #F87171; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.9rem; line-height: 1.5; height: auto; white-space: pre-wrap; }
        .screenshot-box { border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden; height: 300px; background: #000; display: flex; align-items: center; justify-content: center; }
        .screenshot-box img { width: 100%; height: 100%; object-fit: contain; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: modalPop 0.3s ease; }
        @keyframes modalPop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header-title { font-size: 1.2rem; font-weight: 700; color: var(--primary-color); margin-bottom: 20px; border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .modal-footer { margin-top: 25px; text-align: right; }
        
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 40; }
        .sidebar-overlay.active { display: block; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 4px; }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: visible; }
            aside { position: fixed; height: 100%; left: -100%; width: 280px; box-shadow: 4px 0 15px rgba(0,0,0,0.1); }
            aside.active { left: 0; }
            #btn-menu-toggle { display: block; }
            main { width: 100%; padding: 20px; }
            h1 { font-size: 1.2rem; }
            .btn-primary { padding: 8px 12px; font-size: 0.85rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 15px; }
            .stat-value { font-size: 1.5rem; }
            .session-body { flex-direction: column; padding: 0; }
            .video-box { width: 100%; border-right: none; border-bottom: 1px solid #E5E7EB; }
            .log-table-wrapper { max-height: none; overflow: visible; border: none; }
            .item-info { flex-wrap: wrap; gap: 5px; }
            .modal-box { width: 90%; }
        }

        /* ★ [인쇄 설정] 다운로드(PDF 저장) 시 적용됨 */
        @media print {
            aside, button, #btn-config, #btn-menu-toggle, .checkbox-wrapper { display: none !important; }
            body { height: auto; overflow: visible; background-color: white; display: block; }
            main { padding: 0; overflow: visible; }
            .view-section { display: block !important; margin-bottom: 30px; }
            .accordion-content { display: block !important; }
            .accordion-header { border-bottom: 1px solid #ccc !important; }
            .session-item { border-bottom: 1px solid #ccc !important; page-break-inside: avoid; }
            
            /* 선택되지 않은 항목 숨김 */
            .print-hidden { display: none !important; }
            
            /* ★ [핵심] 실패 내역의 이미지(스크린샷) 숨김 */
            .screenshot-box { display: none !important; }
            .fail-body { grid-template-columns: 1fr !important; } /* 에러 로그만 넓게 표시 */
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar">
        <div class="brand">
            쉽배송 자동화 QA
        </div>
        
        <div class="menu-category">대시보드</div>
        <div class="menu-item active" id="nav-overview"><span class="material-icons-round">list_alt</span>테스트 수행 목록</div>
        <div class="menu-item" id="nav-session-a"><span class="material-icons-round">play_circle</span>세션 A (퓨어계정)</div>
        <div class="menu-item" id="nav-session-b"><span class="material-icons-round">play_circle</span>세션 B (배송신청)</div>
        <div class="menu-item fail-menu" id="nav-failures"><span class="material-icons-round">bug_report</span>실패 내역<span class="menu-badge" id="sidebar-fail-count">0</span></div>
        <div class="spacer-bottom"></div>
        <div class="menu-item" id="btn-config"><span class="material-icons-round">info</span>정보</div>
    </aside>

    <main>
        <header>
            <div class="header-left">
                <button id="btn-menu-toggle" onclick="toggleSidebar()"><span class="material-icons-round">menu</span></button>
                <div>
                    <h1 id="page-title">테스트 수행 목록</h1>
                    <div class="last-updated" id="run-time">기록을 불러오는 중...</div>
                </div>
            </div>
            <div><button id="btn-download" class="btn-primary">리포트 다운로드</button></div>
        </header>

        <div id="view-overview" class="view-section active">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-label">테스트 항목 (Latest)</span><span class="stat-value" id="stat-total">-</span></div>
                <div class="stat-card"><span class="stat-label">성공</span><span class="stat-value pass" id="stat-pass">-</span></div>
                <div class="stat-card"><span class="stat-label">실패</span><span class="stat-value fail" id="stat-fail">-</span></div>
                <div class="stat-card"><span class="stat-label">종합 결과</span><span class="stat-value" id="stat-duration">-</span></div>
            </div>
            <div class="accordion-container" id="overview-list"></div>
        </div>

        <div id="view-session-a" class="view-section">
            <div class="accordion-container" id="session-a-list"></div>
        </div>

        <div id="view-session-b" class="view-section">
            <div class="accordion-container" id="session-b-list"></div>
        </div>

        <div id="view-failures" class="view-section">
            <div class="accordion-container" id="failures-list"></div>
        </div>

    </main>

    <div id="info-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header-title"><span class="material-icons-round">info</span>환경 정보</div>
            <div class="modal-content">
                <p><strong>대상 환경:</strong> Staging (shipbaesong.com)</p>
                <p><strong>브라우저:</strong> Chromium (Headless)</p>
                <p><strong>실행 도구:</strong> Playwright</p>
                <p><strong>담당자:</strong> 이상주</p>
            </div>
            <div class="modal-footer"><button class="btn-primary" onclick="closeModal()">닫기</button></div>
        </div>
    </div>

    <script>
        // ★ ID 및 설명 정의
        const SHORT_TITLES = {
            "ID_0001": "메인 진입 및 팝업 처리", "ID_0002": "이용안내 페이지 이동(비로그인)", "ID_0003": "배송신청 페이지 이동(비로그인)", 
            "ID_0004": "배송현황 페이지 이동(비로그인)", "ID_0005": "고객지원 페이지 이동(비로그인)", "ID_0006": "로그인(퓨어계정)", 
            "ID_0007": "배송현황 페이지 확인", "ID_0008": "최근신청 내역 미제공 체크", "ID_0009": "최근신청 내역 > 해외배송 신청하기", 
            "ID_0010": "주소록 관리 > 팝업 내 주소 내역 미제공", "ID_0011": "주소록 > 새로운 주소 추가 시 화면 변경", "ID_0012": "로그아웃 수행", 
            "ID_0013": "메인페이지 > 해외배송 신청하기 랜딩 확인", "ID_0014": "배송조회_tracking 페이지 랜딩 확인", "ID_0015": "메인 배너 UI 노출 확인", 
            "ID_0016": "챗봇 펼치기 > 닫기 확인", "ID_0017": "화면 최하단까지 스크롤(UI체크)", "ID_0018": "비즈니스 고객 [서비스 이용하기] 선택", 
            "ID_0019": "푸터영역 SNS 랜딩 확인", "ID_0020": "푸터영역 약관 팝업 노출 확인", "ID_0021": "메인 진입 및 팝업 처리", 
            "ID_0022": "배송신청 : 해외배송", "ID_0023": "기본주소록 선택 후 단계 진행", "ID_0024": "1박스,픽업발송_배송신청 완료", 
            "ID_0025": "배송현황 상세보기 진입", "ID_0026": "상세페이지 스크롤", "ID_0027": "배송신청 : 구매대행", "ID_0028": "배송현황 기간별 조회 기능 동작",
            "ID_0029": "2박스,든든보험,직접발송_배송신청 완료", "ID_0030": "배송현황 상세보기 및 송장번호 입력",
            "ID_0031": "배송현황 : 받는 사람 주소 수정", "ID_0032": "배송현황 : 배송조회, Tracking 페이지 기능동작"
        };

        const SESSION_A_IDS = Object.keys(SHORT_TITLES).filter(id => parseInt(id.split('_')[1]) <= 20);
        const SESSION_B_IDS = Object.keys(SHORT_TITLES).filter(id => parseInt(id.split('_')[1]) > 20);

        let allHistoryData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('history.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error("History file not found");
                allHistoryData = await res.json();
                
                if (allHistoryData.length > 0) {
                    renderDashboard(allHistoryData);
                } else {
                    document.getElementById('overview-list').innerHTML = '<div class="empty-row">데이터가 없습니다. npm test를 실행해주세요.</div>';
                }
            } catch (e) {
                console.warn("데이터 로드 실패:", e);
                document.getElementById('overview-list').innerHTML = '<div class="empty-row">⚠️ history.json을 불러오지 못했습니다.</div>';
            }
        });

        // ★ [PDF 인쇄 로직]
        document.getElementById('btn-download').addEventListener('click', () => {
            const checkedBoxes = document.querySelectorAll('input[type="checkbox"]:checked');
            
            if (checkedBoxes.length === 0) {
                alert("다운로드할 항목을 선택해주세요.");
                return;
            }

            // 1. 모든 항목 숨김 (초기화)
            document.querySelectorAll('.accordion-item').forEach(el => el.classList.add('print-hidden'));

            // 2. 선택된 항목 및 관련 섹션 표시
            checkedBoxes.forEach(box => {
                // 체크박스 ID "chk-0" -> index "0" 추출
                const index = parseInt(box.id.split('-')[1]);
                const data = allHistoryData[index];

                // Overview 항목 표시
                const groupItem = document.getElementById(`group-${index}`);
                if(groupItem) groupItem.classList.remove('print-hidden');

                // Session A & B 항목 표시
                const sessionAItem = document.getElementById(`sessionA-${index}`);
                if(sessionAItem) sessionAItem.classList.remove('print-hidden');

                const sessionBItem = document.getElementById(`sessionB-${index}`);
                if(sessionBItem) sessionBItem.classList.remove('print-hidden');

                // ★ [조건] 실패가 있는 경우에만 실패 내역 표시
                if (data.stats.failed > 0) {
                    const failItem = document.getElementById(`fail-${index}`);
                    if(failItem) failItem.classList.remove('print-hidden');
                }
            });

            // 3. 브라우저 인쇄 실행 (PDF 저장)
            window.print();

            // 4. 인쇄 후 모든 항목 다시 표시 (원상복구)
            document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('print-hidden'));
        });

        function renderDashboard(data) {
            const latest = data[0];
            const latestDate = new Date(latest.timestamp).toLocaleString('ko-KR');
            
            const total = latest.stats.total;
            const passed = latest.stats.passed;
            const failed = latest.stats.failed;

            document.getElementById('run-time').textContent = `${latestDate} (Latest)`;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-pass').textContent = passed;
            document.getElementById('stat-fail').textContent = failed;
            
            const isAllPass = failed === 0;
            const statusText = isAllPass ? "PASS" : "FAIL";
            const statusClass = isAllPass ? "pass" : "fail";
            document.getElementById('stat-duration').innerHTML = `<span class="stat-value ${statusClass}" style="font-size:1.5rem">${statusText}</span>`;
            
            document.getElementById('sidebar-fail-count').textContent = failed;

            renderOverviewList(data);
            renderSessionList('session-a-list', data, 'sessionA'); 
            renderSessionList('session-b-list', data, 'sessionB'); 
            renderFailuresList(data);
        }

        function renderOverviewList(data) {
            const container = document.getElementById('overview-list');
            container.innerHTML = '';

            data.forEach((item, index) => {
                const isLatest = index === 0;
                const activeClass = isLatest ? 'active' : '';
                const dateStr = new Date(item.timestamp).toLocaleString('ko-KR');
                
                const failedCount = item.stats.failed;
                const failBadge = failedCount > 0 
                    ? `<span class="status-badge fail header-status">Fail (${failedCount})</span>` 
                    : `<span class="status-badge pass header-status">Pass</span>`;

                const logMap = {};
                if (item.sessionA) item.sessionA.forEach(log => logMap[log.id] = log);
                if (item.sessionB) item.sessionB.forEach(log => logMap[log.id] = log);

                let rowsHTML = '';
                Object.keys(SHORT_TITLES).forEach(id => {
                    const log = logMap[id];
                    let badge;

                    if (!log) {
                        badge = '<span class="status-badge na">-</span>';
                    } else if (log.status === 'pass') {
                        badge = '<span class="status-badge pass">성공</span>';
                    } else {
                        badge = '<span class="status-badge fail">실패</span>';
                    }

                    const title = SHORT_TITLES[id];
                    const sessionName = parseInt(id.split('_')[1]) <= 20 ? 'Session A' : 'Session B';
                    
                    rowsHTML += `<tr>
                        <td style="font-weight:bold; color:var(--primary-color)">${id}</td>
                        <td style="font-weight:600">${title}</td>
                        <td style="color:#666">${sessionName}</td>
                        <td style="text-align:right">${badge}</td>
                    </tr>`;
                });

                const html = `
                <div class="accordion-item ${activeClass}" id="group-${index}">
                    <div class="accordion-header" onclick="toggleAccordion('group-${index}')">
                        <div class="checkbox-wrapper" onclick="event.stopPropagation()">
                            <input type="checkbox" id="chk-${index}">
                        </div>
                        <div class="date-title">${dateStr} ${isLatest ? '(Latest)' : ''} ${failBadge}</div>
                        <span class="material-icons-round toggle-icon">expand_more</span>
                    </div>
                    <div class="accordion-content">
                        <table>
                            <thead><tr><th width="12%">ID</th><th width="45%">항목명</th><th width="25%">세션</th><th width="18%" style="text-align:right">상태</th></tr></thead>
                            <tbody>${rowsHTML}</tbody>
                        </table>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderSessionList(containerId, data, sessionKey) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            data.forEach((item, index) => {
                const isLatest = index === 0;
                const activeClass = isLatest ? 'active' : '';
                const dateStr = new Date(item.timestamp).toLocaleString('ko-KR');
                const logs = item[sessionKey] || [];

                const hasFail = logs.some(l => l.status === 'fail');
                const badge = hasFail 
                    ? `<span class="status-badge fail header-status">Issues Found</span>` 
                    : `<span class="status-badge pass header-status">Pass</span>`;

                let listHTML = '<div class="session-list-container">';
                
                logs.forEach(log => {
                    const statusBadge = log.status === 'pass' 
                        ? `<span class="status-badge pass">성공</span>` 
                        : `<span class="status-badge fail">실패</span>`;
                    

                    const title = log.title || SHORT_TITLES[log.id];
                    const desc = log.desc || "상세 설명 없음";

                    listHTML += `
                    <div class="session-item">
                        <div class="item-top-row">
                            <div class="item-info">
                                <span class="item-id">${log.id}</span>
                                <span class="item-title">${title}</span>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                        <div class="item-desc">
                            ${desc}
                        </div>
                    </div>`;
                });
                listHTML += '</div>';


                const videoFileName = sessionKey === 'sessionA' ? 'SessionA.webm' : 'SessionB.webm';
                const posterText = sessionKey === 'sessionA' ? 'sessionA Recording' : 'sessionB Recording';
                const posterUrl = `https://placehold.co/600x400/e0e0e0/555?text=${encodeURIComponent(posterText)}`;

                const videoHtml = `
                    <div class="video-box">
                        <video controls poster="${posterUrl}">
                            <source src="videos/${videoFileName}" type="video/webm">
                        </video>
                    </div>`;

                const html = `
                <div class="accordion-item ${activeClass}" id="${sessionKey}-${index}">
                    <div class="accordion-header" onclick="toggleAccordion('${sessionKey}-${index}')">
                        <div class="date-title">${dateStr} ${isLatest ? '(Latest)' : ''} ${badge}</div>
                        <span class="material-icons-round toggle-icon">expand_more</span>
                    </div>
                    <div class="accordion-content">
                        <div class="session-body">
                            ${isLatest ? videoHtml : ''} 
                            <div class="log-table-wrapper">
                                ${listHTML || '<div class="empty-row">로그 없음</div>'}
                            </div>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderFailuresList(data) {
            const container = document.getElementById('failures-list');
            container.innerHTML = '';
            
            data.forEach((item, index) => {
                const isLatest = index === 0;
                const activeClass = isLatest ? 'active' : '';
                const dateStr = new Date(item.timestamp).toLocaleString('ko-KR');

                const allLogs = [...(item.sessionA || []), ...(item.sessionB || [])];
                const failures = allLogs.filter(l => l.status === 'fail');
                
                let contentHTML = '';
                if (failures.length === 0) {
                    contentHTML = '<div class="success-state"><span class="material-icons-round success-icon">check_circle</span><h3>성공!</h3><p>실패 내역이 없습니다.</p></div>';
                } else {
                    failures.forEach(fail => {
                        contentHTML += `
                        <div class="fail-card" style="margin:20px;">
                            <div class="fail-header"><span class="fail-tag">FAILED</span><span class="fail-title">${fail.id} | ${SHORT_TITLES[fail.id]}</span></div>
                            <div class="fail-body">
                                <div class="error-log-box">${fail.desc}</div>
                                <div class="screenshot-box">
                                    <img src="placeholder-screenshot.png" alt="스크린샷" onerror="this.style.display='none'">
                                </div>
                            </div>
                        </div>`;
                    });
                }
                const html = `<div class="accordion-item ${activeClass}" id="fail-${index}"><div class="accordion-header" onclick="toggleAccordion('fail-${index}')"><div class="date-title">${dateStr}</div><span class="material-icons-round toggle-icon">expand_more</span></div><div class="accordion-content">${contentHTML}</div></div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function toggleAccordion(id) { document.getElementById(id).classList.toggle('active'); }
        function openModal() { document.getElementById('info-modal').classList.add('open'); }
        function closeModal() { document.getElementById('info-modal').classList.remove('open'); }
        function toggleSidebar() { 
            document.getElementById('sidebar').classList.toggle('active'); 
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
        document.getElementById('btn-config').addEventListener('click', openModal);
        
        const menus = { overview: document.getElementById('nav-overview'), sessionA: document.getElementById('nav-session-a'), sessionB: document.getElementById('nav-session-b'), failures: document.getElementById('nav-failures') };
        const views = { overview: document.getElementById('view-overview'), sessionA: document.getElementById('view-session-a'), sessionB: document.getElementById('view-session-b'), failures: document.getElementById('view-failures') };
        const pageTitle = document.getElementById('page-title');
        
        function switchTab(tabName) {
            Object.values(menus).forEach(el => el.classList.remove('active'));
            Object.values(views).forEach(el => el.classList.remove('active'));

            menus[tabName].classList.add('active');
            views[tabName].classList.add('active');
            if(window.innerWidth <= 768) toggleSidebar();

            const btn = document.getElementById('btn-download');
            if(tabName === 'overview') {
                pageTitle.textContent = '테스트 수행 목록';
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
                if(tabName === 'sessionA') pageTitle.textContent = '세션 A 리포트';
                else if(tabName === 'sessionB') pageTitle.textContent = '세션 B 리포트';
                else if(tabName === 'failures') pageTitle.textContent = '실패 분석 리포트';
            }
        }

        menus.overview.addEventListener('click', () => switchTab('overview'));
        menus.sessionA.addEventListener('click', () => switchTab('sessionA'));
        menus.sessionB.addEventListener('click', () => switchTab('sessionB'));
        menus.failures.addEventListener('click', () => switchTab('failures'));
    </script>
</body>
</html>
