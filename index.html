<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쉽배송 자동화 테스트 리포트</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
    header { background: #003366; color: white; padding: 1rem; text-align: center; }
    .container { padding: 2rem; max-width: 1000px; margin: 0 auto; }
    h2 { border-bottom: 2px solid #003366; padding-bottom: 0.5rem; }
    .bold { font-weight: bold; }
    .summary { background: #fff; padding: 1rem; border-radius: 4px; margin-top: 1rem; }
    .stats { background: #e8f0fe; padding: 1rem; border-radius: 4px; margin-top: 1.5rem; }
  </style>
</head>

<body>
  <header>
    <h1>쉽배송 자동화 테스트 리포트</h1>
    <p id="run-time"></p>
    <script>
      const now = new Date();
      const formatted = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');
      document.getElementById('run-time').textContent = '실행 일시: ' + formatted;
    </script>
  </header>

  <div class="container">
    <h2>테스트 진행 영상</h2>
    <p>전체 시나리오 (Session A + B) 자동화 진행 영상</p>
    <video width="100%" controls>
      <source src="tests/video/video.webm" type="video/webm">
      브라우저가 video 태그를 지원하지 않습니다.
    </video>

    <div class="summary">
      <h2>테스트 시나리오 구성</h2>
      <p class="bold">Session A – 비로그인 / 페이지 이동 / 로그인 / 마이페이지</p>
      <ul>
        <li>ID_0001~ID_0009 : 사이트 진입, 페이지 이동, 로그인, 마이페이지, 로그아웃</li>
      </ul>

      <p class="bold">Session B – 배송신청 및 배송현황</p>
      <ul>
        <li>ID_0010~ID_0020 : 로그인, 배송신청, 금지품목 확인, 완료, 배송현황 상세보기</li>
      </ul>
    </div>

    <div class="stats">
      <p class="bold">결과 요약</p>
      <p>전체 테스트 항목: <strong>20개</strong></p>
      <p>성공: <strong>20</strong> / 실패: <strong>0</strong></p>
    </div>
  </div>
</body>
</html>
